<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENOVA SOCIAL MEDIA SERVICES</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        p.subtitle {
            text-align: center;
            color: var(--sub-text);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input[type="url"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus {
            border-color: #38bdf8;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        #statusMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .success {
            background-color: #14532d;
            color: #4ade80;
            border: 1px solid #166534;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DENOVA SERVICES</h1>
    <p class="subtitle">TikTok Automatic Services Panel</p>

    <form id="orderForm">
        <div class="form-group">
            <label for="serviceSelect">Select Service</label>
            <select id="serviceSelect" required>
                <option value="TikTok Likes (Standard - ID: 1654)">TikTok Likes (Standard - ID: 1654)</option>
                <option value="TikTok Likes - No Drop (ID: 1618)">TikTok Likes - No Drop (ID: 1618)</option>
                <option value="TikTok Promote (ID: 1431)">TikTok Promote (ID: 1431)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="videoUrl">TikTok Video Link</label>
            <input type="url" id="videoUrl" placeholder="https://vt.tiktok.com/..." required>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" placeholder="e.g. 1000" min="100" value="1000" required>
        </div>

        <button type="submit" class="btn">PLACE ORDER VIA TELEGRAM</button>
    </form>

    <div id="statusMessage" class="success" style="display: block;">
        ℹ️ အော်ဒါတင်လိုက်သည်နှင့် သင့်ထံသို့ Telegram မှတဆင့် တိုက်ရိုက်ရောက်ရှိမည်။
    </div>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const service = document.getElementById('serviceSelect').value;
        const videoUrl = document.getElementById('videoUrl').value.trim();
        const quantity = document.getElementById('quantity').value.trim();

        // သင့်ရဲ့ Telegram Username (သို့) Chat ID 
        // ဥပမာ - denova0
        const telegramUsername = "denova0"; 

        // ပို့မည့် စာသားဖော်မတ်
        const message = `🔥 New DENOVA Order!%0A%0A📦 Service: ${service}%0A🔗 Link: ${videoUrl}%0A🔢 Quantity: ${quantity}`;

        // Telegram သို့ တိုက်ရိုက်လင့်ခ်ဖွင့်ရန်
        const telegramUrl = `https://t.me/${telegramUsername}?text=${message}`;

        window.open(telegramUrl, '_blank');
    });
</script>

</body>
</html>
