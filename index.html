<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENOVA SOCIAL MEDIA SERVICES</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        p.subtitle {
            text-align: center;
            color: var(--sub-text);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="url"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        #statusMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .success {
            background-color: #14532d;
            color: #4ade80;
            border: 1px solid #166534;
        }

        .error {
            background-color: #450a0a;
            color: #f87171;
            border: 1px solid #991b1b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DENOVA SERVICES</h1>
    <p class="subtitle">TikTok Automatic Promotion Panel</p>

    <form id="orderForm">
        <div class="form-group">
            <label for="apiKey">API Key (Your SocialBoostMM Key)</label>
            <input type="password" id="apiKey" placeholder="Paste your API key here" required>
        </div>

        <div class="form-group">
            <label for="videoUrl">TikTok Video Link</label>
            <input type="url" id="videoUrl" placeholder="https://vt.tiktok.com/..." required>
        </div>

        <div class="form-group">
            <label for="quantity">Likes Quantity (Min: 100)</label>
            <input type="number" id="quantity" placeholder="e.g. 1000" min="100" value="1000" required>
        </div>

        <button type="submit" id="submitBtn" class="btn">PLACE ORDER NOW</button>
    </form>

    <div id="statusMessage"></div>
</div>

<script>
    const SERVICE_ID = "1654"; // TikTok Likes Service ID

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const apiKey = document.getElementById('apiKey').value.trim();
        const videoUrl = document.getElementById('videoUrl').value.trim();
        const quantity = document.getElementById('quantity').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        if (!apiKey || !videoUrl || !quantity) {
            showStatus('ကျေးဇူးပြု၍ အချက်အလက်များ အကုန်ဖြည့်ပါ', 'error');
            return;
        }

        // Button Disable & Loading State
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing Order...";
        statusMessage.style.display = 'none';

        try {
            // Send request to SocialBoostMM API
            const response = await fetch('https://socialboostmm.com/api/v2', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'key': apiKey,
                    'action': 'add',
                    'service': SERVICE_ID,
                    'link': videoUrl,
                    'quantity': quantity
                })
            });

            const data = await response.json();

            if (data.order) {
                showStatus(`✅ အော်ဒါ အောင်မြင်ပါသည်။ Order ID: ${data.order}`, 'success');
                document.getElementById('videoUrl').value = '';
            } else if (data.error) {
                showStatus(`❌ မအောင်မြင်ပါ: ${data.error}`, 'error');
            } else {
                showStatus('❌ စနစ်ဆိုင်ရာ အမှားအယွင်း ရှိနေပါသည်', 'error');
            }

        } catch (error) {
            console.error('Error:', error);
            showStatus('❌ Server နှင့် ချိတ်ဆက်၍ မရပါ (API/Network Error)', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "PLACE ORDER NOW";
        }
    });

    function showStatus(text, type) {
        const statusMessage = document.getElementById('statusMessage');
        statusMessage.innerText = text;
        statusMessage.className = type;
        statusMessage.style.display = 'block';
    }
</script>

</body>
</html>
