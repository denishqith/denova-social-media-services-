<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZARIA - Social Media Services</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --accent-purple: #a855f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
        }

        /* Logo & Header Section */
        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: #d8b4fe;
            letter-spacing: 1.5px;
            margin: 0;
        }

        .header-subtitle {
            font-size: 0.8rem;
            color: var(--text-sub);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Glassmorphism User Card */
        .info-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .info-card .icon {
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .info-card .title {
            font-weight: bold;
            font-size: 1.05rem;
            color: #f8fafc;
        }

        .info-card .subtitle {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* Glass Platform Grid (TikTok & Telegram Only) */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .platform-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 12px 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .platform-btn:hover, .platform-btn.active {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.15);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        /* Glass Order Form Box */
        .form-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 22px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            background: rgba(15, 23, 42, 0.6);
            color: white;
        }

        select option {
            background: #0f172a;
            color: white;
        }

        select:focus, input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        /* Service Description Box */
        .service-desc {
            background: rgba(15, 23, 42, 0.4);
            border-left: 4px solid var(--accent-purple);
            padding: 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 16px;
            line-height: 1.6;
            border-top: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
        }

        .charge-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d8b4fe;
            margin-bottom: 18px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #7e22ce 0%, #6b21a8 100%);
            box-shadow: 0 6px 20px rgba(147, 51, 234, 0.6);
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Header with ZARIA Logo -->
    <div class="header-container">
        <!-- သင့် Logo ပုံလေးကို Github repository ထဲမှာ 'logo.png' အဖြစ် တင်ထားပေးပါ -->
        <img src="logo.png" alt="ZARIA Logo" class="logo-img" onerror="this.style.display='none'">
        <div class="header-title">ZARIA</div>
        <div class="header-subtitle">Social Media Services</div>
    </div>

    <!-- User Info Card -->
    <div class="info-card">
        <div class="icon">👤</div>
        <div>
            <div class="title">zaria</div>
            <div class="subtitle">Username ဖြစ်ပါသည်</div>
        </div>
    </div>

    <!-- Platform Icons Grid (TikTok & Telegram Only) -->
    <div class="platform-grid">
        <div class="platform-btn active" onclick="selectPlatform('tiktok', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            TikTok
        </div>
        <div class="platform-btn" onclick="selectPlatform('telegram', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="12" fill="#2AABEE"/>
                <path d="M5.463 12.012c4.326-1.884 7.211-3.125 8.656-3.727 4.126-1.717 4.983-2.015 5.542-2.025.123-.002.398.029.576.173.15.122.192.287.212.403.02.116.045.38.025.587-.229 2.408-1.22 8.246-1.724 10.942-.213 1.14-.633 1.522-1.04 1.559-.883.082-1.553-.583-2.408-1.144-1.338-.878-2.094-1.424-3.393-2.28-1.501-.99-.528-1.535.328-2.425.224-.233 4.113-3.769 4.188-4.09.009-.04.018-.189-.071-.269-.089-.08-.22-.053-.315-.031-.135.03-2.282 1.45-6.442 4.26-.609.418-1.161.623-1.656.612-.546-.012-1.597-.309-2.378-.563-.957-.312-1.717-.478-1.651-1.007.035-.276.416-.559 1.143-.849z" fill="#FFFFFF"/>
            </svg>
            Telegram
        </div>
    </div>

    <!-- Order Form Box -->
    <div class="form-box">
        <form id="orderForm">
            <div class="form-group">
                <label for="categorySelect">အမျိုးအစား (Category)</label>
                <select id="categorySelect" onchange="filterServices()">
                    <option value="tiktok">⭐ TikTok Services</option>
                    <option value="telegram">✈️ Telegram Services</option>
                </select>
            </div>

            <div class="form-group">
                <label for="serviceSelect">Services</label>
                <select id="serviceSelect" required onchange="updateServiceDetails()">
                    <!-- TikTok Services -->
                    <option value="1618" data-cat="tiktok" data-desc="📌 Service အသစ်ဖြစ်ပါသည်။<br>➢ Bot Quality ဖြစ်လို့ Likes ပေးတာတေကိုမမြင်ရပါဘူးဗျ<br>➢ ပြန်မကျသေးပါဘူးဗျ<br>➢ ရက် ၃၀ အတွင်း ပြန်ကျခဲ့ရင် ပြန်ဖြည့်/ ပြန်အမ်းပေးတဲ့ အာမခံ ရှိပါတယ်ဗျ" data-price="3000">🛡️ TikTok Likes - No Drop (ID: 1618)</option>
                    <option value="1431" data-cat="tiktok" data-desc="⭐ TikTok Promote ကို 1 Day နဲ့ Run ပေးမည်ဖြစ်ပါသည်။<br>➢ TikTok Noti မှတဆင့် Approve လုပ်ပေးရပါမည်။<br>➢ လက်မခံပါက လိုက်ဆันဖြတ်ပါမည်။" data-price="6500">⭐ TikTok Promote | FYP ပေါ်တင် (ID: 1431)</option>
                    <option value="1654" data-cat="tiktok" data-desc="⚡ TikTok Likes (Standard)<br>➢ အမြန်နှုန်းသင့်တင့်ပြီး သုံးစွဲရလွယ်ကူပါသည်။" data-price="1200">⚡ TikTok Likes (Standard - ID: 1654)</option>
                    
                    <!-- Telegram Services -->
                    <option value="2001" data-cat="telegram" data-desc="✈️ Telegram Channel Members (High Quality)<br>➢ အကောင်းဆုံး အရည်အသွေးရှိ Member များ ထည့်သွင်းပေးသည်။" data-price="4000">✈️ Telegram Members | အကောင်းဆုံး (ID: 2001)</option>
                </select>
            </div>

            <!-- Service Description Display -->
            <div id="serviceDescBox" class="service-desc">
                📌 Service အသစ်ဖြစ်ပါသည်။<br>
                ➢ Bot Quality ဖြစ်လို့ Likes ပေးတာတေကိုမမြင်ရပါဘူးဗျ<br>
                ➢ ပြန်မကျသေးပါဘူးဗျ<br>
                ➢ ရက် ၃၀ အတွင်း ပြန်ကျခဲ့ရင် ပြန်ဖြည့်/ ပြန်အမ်းပေးတဲ့ အာမခံ ရှိပါတယ်ဗျ
            </div>

            <div class="form-group">
                <label for="targetUrl">Link (Video / Channel Link)</label>
                <input type="text" id="targetUrl" placeholder="https://vt.tiktok.com/... သို့မဟုတ် t.me/..." required>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity (အရေအတွက်)</label>
                <input type="number" id="quantity" placeholder="1000" min="100" value="1000" required oninput="calculateTotal()">
            </div>

            <!-- Charge Display -->
            <div class="charge-box" id="chargeDisplay">
                ကျသင့်ငွေ: K 1,200
            </div>

            <button type="submit" class="submit-btn">
                <span>PLACE ORDER VIA TELEGRAM</span>
            </button>
        </form>
    </div>
</div>

<script>
    function selectPlatform(platform, element) {
        const catSelect = document.getElementById('categorySelect');
        catSelect.value = platform;
        filterServices();
        
        document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('active'));
        if (element) {
            element.classList.add('active');
        }
    }

    function filterServices() {
        const cat = document.getElementById('categorySelect').value;
        const serviceSelect = document.getElementById('serviceSelect');
        const options = serviceSelect.options;

        let firstVisible = null;
        for (let i = 0; i < options.length; i++) {
            const opt = options[i];
            if (opt.getAttribute('data-cat') === cat) {
                opt.style.display = 'block';
                if (!firstVisible) firstVisible = opt.value;
            } else {
                opt.style.display = 'none';
            }
        }
        if (firstVisible) {
            serviceSelect.value = firstVisible;
            updateServiceDetails();
        }
    }

    function updateServiceDetails() {
        const select = document.getElementById('serviceSelect');
        const selectedOption = select.options[select.selectedIndex];
        
        if (selectedOption && selectedOption.style.display !== 'none') {
            document.getElementById('serviceDescBox').innerHTML = selectedOption.getAttribute('data-desc');
            calculateTotal();
        }
    }

    function calculateTotal() {
        const select = document.getElementById('serviceSelect');
        const selectedOption = select.options[select.selectedIndex];
        if (!selectedOption) return;
        
        const basePrice = parseInt(selectedOption.getAttribute('data-price')) || 1200;
        const quantity = parseInt(document.getElementById('quantity').value) || 1000;
        
        const total = Math.round((basePrice / 1000) * quantity);
        document.getElementById('chargeDisplay').innerText = `ကျသင့်ငွေ: K ${total.toLocaleString()}`;
    }

    // Initial run
    filterServices();

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const catSelect = document.getElementById('categorySelect');
        const serviceSelect = document.getElementById('serviceSelect');
        const category = catSelect.options[catSelect.selectedIndex].text;
        const serviceName = serviceSelect.options[serviceSelect.selectedIndex].text;
        const targetUrl = document.getElementById('targetUrl').value.trim();
        const quantity = document.getElementById('quantity').value.trim();
        const charge = document.getElementById('chargeDisplay').innerText;
        const telegramUsername = "denova0"; // သင့် Telegram Username

        const message = `🔥 New ZARIA Order!%0A%0A📁 Category: ${category}%0A📦 Service: ${serviceName}%0A🔗 Link: ${targetUrl}%0A🔢 Quantity: ${quantity}%0A💰 ${charge}`;
        const telegramUrl = `https://t.me/${telegramUsername}?text=${message}`;

        window.open(telegramUrl, '_blank');
    });
</script>

</body>
</html>
